plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.148'
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
}

repositories {
    maven {
        url = 'https://api.modrinth.com/maven'
    }
    maven {
        url = 'https://repo.spongepowered.org/repository/maven-public/'
    }
}

configurations {
    sableApi
}

dependencies {
    compileOnly 'maven.modrinth:T9PomCSv:2.0.6+mc1.21.1'
    sableApi 'maven.modrinth:T9PomCSv:2.0.6+mc1.21.1'
    compileOnly 'org.spongepowered:mixin:0.8.7'
    annotationProcessor 'org.spongepowered:mixin:0.8.7:processor'
}

def sableCompanionClasses = layout.buildDirectory.dir('generated/sable-companion-classes')

tasks.register('extractSableCompanionClasses') {
    inputs.files(configurations.sableApi)
    outputs.dir(sableCompanionClasses)
    doLast {
        def sableJar = configurations.sableApi.singleFile
        def companionJar = zipTree(sableJar)
                .matching { include 'META-INF/jarjar/sable-companion-common-1.21.1-*.jar' }
                .singleFile
        copy {
            from zipTree(companionJar)
            into sableCompanionClasses
        }
    }
}

sourceSets.main.compileClasspath += files(sableCompanionClasses)

tasks.named('compileJava').configure {
    dependsOn tasks.named('extractSableCompanionClasses')
}

neoForge {
    version = project.neo_version

    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', mod_id
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', mod_id
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

sourceSets.main.resources {
    srcDir 'src/generated/resources'
}

tasks.named('processResources', ProcessResources).configure {
    from 'src/main/templates'
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_description        : mod_description
    ]
    inputs.properties replaceProperties
    filesMatching('META-INF/neoforge.mods.toml') {
        expand replaceProperties
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
